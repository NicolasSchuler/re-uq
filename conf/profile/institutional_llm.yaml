# Provider profile: institutional_llm
# Mirrors the `institutional_llm` entry of run_configs/full_matrix.example.json.
# Secrets are never stored here: `api_key_env` holds the *name* of the
# environment variable that carries the key.
profile_id: "institutional_llm"
provider_id: "institutional_llm"
base_url: "https://institutional-llm.example.invalid/api/v1"
api_key_env: ${oc.env:RE_UQ_INSTITUTIONAL_LLM_API_KEY_ENV,INSTITUTIONAL_LLM_API_KEY}
models:
  - "azure.gpt-4.1-mini"
concurrency: 2
batch_size: 16
timeout_s: 180
max_tokens: 256
seed: 20260518
send_seed: true
max_retries: 3
batch_order: "grouped"
json_mode: true
structured_output: "json_schema"
requires_manual_server: false
notes: "Coordinate large automated runs with the institutional LLM endpoint operator."
