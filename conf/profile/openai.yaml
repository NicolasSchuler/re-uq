# Provider profile: openai
# Mirrors the `openai` entry of run_configs/full_matrix.example.json.
# Secrets are never stored here: `api_key_env` holds the *name* of the
# environment variable that carries the key.
profile_id: "openai"
provider_id: "openai"
base_url: "https://api.openai.com/v1"
api_key_env: ${oc.env:RE_UQ_OPENAI_API_KEY_ENV,OPENAI_API_KEY}
models:
  - "gpt-5-mini"
  - "gpt-5"
  - "gpt-4.1-mini"
concurrency: 4
batch_size: 8
timeout_s: 180
max_tokens: 256
seed: 20260518
send_seed: true
max_retries: 3
batch_order: "grouped"
json_mode: true
structured_output: "json_object"
requires_manual_server: false
notes: "Native OpenAI endpoint. json_schema structured output is available but json_object is the conservative default that all listed models accept."
