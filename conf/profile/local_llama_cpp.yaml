# Provider profile: local_llama_cpp
# Mirrors the `local_llama_cpp` entry of run_configs/full_matrix.example.json.
# Secrets are never stored here: `api_key_env` holds the *name* of the
# environment variable that carries the key.
profile_id: "local_llama_cpp"
provider_id: "llama_cpp"
# Your llama.cpp / llama-swap server. The campaign used a lab GPU host; set
# the address here or export RE_UQ_LOCAL_LLAMA_CPP_BASE_URL.
base_url: ${oc.env:RE_UQ_LOCAL_LLAMA_CPP_BASE_URL,http://localhost:9292/v1}
api_key_env: ${oc.env:RE_UQ_LOCAL_LLAMA_CPP_API_KEY_ENV,LLAMA_API_KEY}
models:
  - "qwen3.6-27b"
  - "qwen3.8-27b"
  - "qwen3.5-9b"
  - "gemma4-31b-it"
  - "gemma4-12b-it"
  - "muse-glimmer-30b"
  - "gpt-oss-20b"
# Matches the llama-swap slot count (--parallel 8, set 2026-09-11). Keep the two
# equal: fewer workers idle the GPU, more workers queue at the server and burn
# the timeout. The headline cohort ran at 2 workers on 4 slots.
concurrency: 8
# Final primary protocol: one item per request. Server concurrency provides
# parallelism without exposing sibling modality variants in one prompt.
# Batching ablations override this explicitly; do not change it mid-campaign.
batch_size: 1
timeout_s: 300
# 1024 rather than 512: Muse Glimmer and gpt-oss spend 100-500 tokens of
# reasoning before the answer (separated into reasoning_content), and the
# single-item primary protocol gives an item only this budget.
max_tokens: 1024
seed: 20260518
send_seed: true
max_retries: 3
batch_order: "grouped"
json_mode: false
# Constrain the existing JSON contract, including GPT-OSS's Harmony final
# header. Unconstrained output can emit a valid JSON-format header that this
# server build rejects; Qwen3.5 audits also need JSON escaping constraints.
# Qualification evidence: docs/internal/generation_qualification_2026-09-11.md.
structured_output: "json_schema"
requires_manual_server: false
# Qwen3.6 thinks by default and only writes the answer to `content` after the
# reasoning, so a 16-item batch would spend its token budget on reasoning and
# come back empty. The chat template's switch turns it off, the counterpart of
# `thinking: disabled` in conf/profile/zai.yaml. (`reasoning_budget: 0` does
# not stop it on this server build; checked 2026-09-10.)
extra_body:
  chat_template_kwargs:
    enable_thinking: false
  # Muse Glimmer and gpt-oss have no non-thinking mode; "low" is their minimum
  # and keeps the reasoning in reasoning_content. Ignored by Qwen and Gemma
  # once thinking is off.
  reasoning_effort: low
notes: "Router loads models by request model name. The rerun driver completes all requests for one model before starting the next."
