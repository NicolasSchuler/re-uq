# Provider profile: zai
# Mirrors the `zai` entry of run_configs/full_matrix.example.json.
# Secrets are never stored here: `api_key_env` holds the *name* of the
# environment variable that carries the key.
profile_id: "zai"
provider_id: "zai"
base_url: "https://api.z.ai/api/coding/paas/v4"
api_key_env: ${oc.env:RE_UQ_ZAI_API_KEY_ENV,ZAI_API_KEY}
# Only ids the endpoint serves under their own name belong here. Checked
# 2026-09-10: the coding endpoint lists glm-4.5 .. glm-5.3-flash but answers
# glm-4.5-air/4.7/5-turbo requests with glm-5.3-flash and glm-5/5.1/5.2 with
# glm-5.3 (see the response `model` field, recorded as `served_model`).
models:
  - "glm-5.3"
  - "glm-5.3-flash"
concurrency: 2
batch_size: 16
timeout_s: 180
max_tokens: 256
seed: 20260518
send_seed: true
max_retries: 3
batch_order: "grouped"
json_mode: true
structured_output: "json_object"
extra_body:
  thinking:
    type: "disabled"
  response_format:
    type: "json_object"
requires_manual_server: false
notes: "GLM Coding Plan endpoint. Standard paid API users should switch this to https://api.z.ai/api/paas/v4."
