# @package _global_
# Does the document context around the
# same minimal-pair sentence change modality preservation?
#
# Cell: dataset pure, variant must, Task 2, deterministic pass only, grouped
# single-item requests (the final primary condition). The two arms differ only in
# `item_context`: `bare` sends today's prompt, `document` adds each item's
# document, section, author marker and neighbouring requirements.
#
# Both arms for the default hosted model:
#   .venv/bin/python scripts/run.py --multirun +experiment=context_ablation
# Both arms for a locally served model:
#   .venv/bin/python scripts/run.py --multirun +experiment=context_ablation \
#     profile=local_llama_cpp model=qwen3.5-9b
# Table:
#   .venv/bin/python scripts/compare_context_ablation.py \
#     --run-group-id context-manuscript-final --stochastic-samples 0 \
#     --output-prefix /tmp/reuq-context/context_ablation_summary
#
# The run group is its own, so these arms can never be selected into the
# paper tables (export_paper_tables.py gates on run_group_id).
defaults:
  - override /profile: zai
  - override /dataset: pure
  - override /variant: must
  - override /sampling: deterministic_only

run_group_id: context-manuscript-final
task: task2
mode: full
model: glm-5.3

profile:
  batch_size: 1
  batch_order: grouped

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      item_context: bare,document
