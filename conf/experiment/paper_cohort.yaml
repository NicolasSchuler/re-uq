# @package _global_
# Hosted half of the paper cohort on the Hydra path: the z.ai GLM models over
# both datasets, both benchmark variants, Task 1 + Task 2, full mode,
# deterministic + 5-sample stochastic passes.
#
# Run:
#   .venv/bin/python scripts/run.py --multirun +experiment=paper_cohort
#
# The reported campaign was driven by scripts/rerun_all.py with
# conf/rerun/final.yaml, which covers the hosted and the local profile in one
# command and records every run id; use this preset to repeat the hosted half
# by itself.
defaults:
  - override /profile: zai
  - override /variant: must
  - override /sampling: default

task: both
mode: full
run_group_id: modality-rerun-2026-09

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model: glm-5.3,glm-5.3-flash
      dataset: nice,mlm_tapt
      variant: must,shall
