# @package _global_
# Deterministic Task 2 size/composition sensitivity on MLM-TAPT/MUST.
# The final driver schedules the five distinct arms in conf/rerun/final.yaml.
# Standalone grouped size sweep (single-item is the primary reference):
#   .venv/bin/python scripts/run.py --multirun +experiment=batching_ablation
# Matched sibling-separated controls, without duplicating the single arm:
#   .venv/bin/python scripts/run.py --multirun +experiment=batching_ablation \
#     profile.batch_size=4,16 profile.batch_order=shuffled
# Profiles, sampling and items stay fixed; batch size/order are explicit.
defaults:
  - override /profile: zai
  - override /dataset: mlm_tapt
  - override /variant: must
  - override /sampling: deterministic_only

run_group_id: manuscript-final
task: task2
mode: full
model: glm-5.3

profile:
  batch_size: 1
  batch_order: grouped

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      profile.batch_size: 1,4,16
