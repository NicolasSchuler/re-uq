# Ablation sweep over the whole local cohort plus glm-5.3, deterministic Task 2
# only, for per-model directional evidence (batching and document context on
# every model; the weak-phrasing probe on glm-5.3 and the strongest local
# strengthener). Same run groups as conf/rerun/ablations.yaml, so the twelve
# cells that finished 2026-09-10 (glm-5.3, qwen3.6-27b) are reused by the
# comparison scripts, not re-run. Keeps its own state file:
#
#   .venv/bin/python scripts/rerun_all.py --config conf/rerun/ablations_all_models.yaml \
#     --state outputs/rerun/modality-rerun-2026-09/ablations_all_models_state.json \
#     --profile local_llama_cpp --only preflight --only ablations
#
# Started 2026-09-11 on the 8-slot llama.cpp server with profile concurrency 8.
run_group_id: modality-rerun-2026-09
embedding: qwen3_06b

datasets: [mlm_tapt]
variants: [must]

cohort_profiles: [zai]
local_profiles: [local_llama_cpp]

ablations:
  batching:
    dataset: mlm_tapt
    variant: must
    models:
      - {profile: local_llama_cpp, model: qwen3.8-27b}
      - {profile: local_llama_cpp, model: qwen3.5-9b}
      - {profile: local_llama_cpp, model: gemma4-31b-it}
      - {profile: local_llama_cpp, model: gemma4-12b-it}
      - {profile: local_llama_cpp, model: muse-glimmer-30b}
      - {profile: local_llama_cpp, model: gpt-oss-20b}
  context:
    run_group_id: context-ablation-2026-09
    models:
      - {profile: local_llama_cpp, model: qwen3.8-27b}
      - {profile: local_llama_cpp, model: qwen3.5-9b}
      - {profile: local_llama_cpp, model: gemma4-31b-it}
      - {profile: local_llama_cpp, model: gemma4-12b-it}
      - {profile: local_llama_cpp, model: muse-glimmer-30b}
      - {profile: local_llama_cpp, model: gpt-oss-20b}
  weak_phrasing:
    dataset: nice
    variant: must
    models:
      - {profile: local_llama_cpp, model: muse-glimmer-30b}

task3:
  audit_mode: blind

analysis:
  bootstrap_samples: 1000
  numbers_output: outputs/paper_numbers.tex
