# Headline-only campaign: the paper's main cell (MLM-TAPT / MUST) for every
# configured model, Task 1+2 plus the blind Task 3 audit, no ablations. Same
# run group as the full plan in default.yaml, so its runs are the same runs a
# later full campaign continues from; it only keeps its own state file:
#
#   .venv/bin/python scripts/rerun_all.py --config conf/rerun/headline.yaml \
#     --state outputs/rerun/modality-rerun-2026-09/headline_state.json
#
# Started 2026-09-10 to get numbers comparable with the archived May tables
# without spending the whole matrix.
run_group_id: modality-rerun-2026-09
embedding: qwen3_06b

datasets: [mlm_tapt]
variants: [must]

cohort_profiles: [zai]
local_profiles: [local_llama_cpp]

# No ablation arms in this campaign.
ablations: {}

task3:
  audit_mode: blind

analysis:
  bootstrap_samples: 1000
  numbers_output: outputs/paper_numbers.tex
