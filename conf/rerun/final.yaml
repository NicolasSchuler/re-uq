# Standalone final-campaign plan, not an extension of the exploratory states.
# Primary protocol: one item per request (revised author decision 2026-09-11).
# Profiles remain the source of model IDs and request settings. Review their
# budgets/settings before launch. This NEW group schedules all 36 main runs
# for the current nine models; it does not import or reuse historical runs.
# PURE source review and explicit compute approval remain launch prerequisites.
run_group_id: manuscript-final
embedding: qwen3_06b
datasets: [mlm_tapt, nice]
variants: [must, shall]
cohort_profiles: [zai]
local_profiles: [local_llama_cpp]
primary_protocol:
  batch_size: 1
  batch_order: grouped
primary_sampling:
  deterministic: 1
  stochastic: 5

ablations:
  batching:
    dataset: mlm_tapt
    variant: must
    batch_sizes: [1, 4, 16]
    batch_orders: [grouped, shuffled]
    baseline_arm: single
    models:
      - {profile: zai, model: glm-5.3}
      - {profile: local_llama_cpp, model: qwen3.6-27b}
      - {profile: local_llama_cpp, model: qwen3.8-27b}
      - {profile: local_llama_cpp, model: qwen3.5-9b}
      - {profile: local_llama_cpp, model: gemma4-31b-it}
      - {profile: local_llama_cpp, model: gemma4-12b-it}
      - {profile: local_llama_cpp, model: muse-glimmer-30b}
      - {profile: local_llama_cpp, model: gpt-oss-20b}
  context:
    run_group_id: context-manuscript-final
    batch_size: 1
    batch_order: grouped
    models:
      - {profile: zai, model: glm-5.3}
      - {profile: local_llama_cpp, model: qwen3.6-27b}
      - {profile: local_llama_cpp, model: qwen3.8-27b}
      - {profile: local_llama_cpp, model: qwen3.5-9b}
      - {profile: local_llama_cpp, model: gemma4-31b-it}
      - {profile: local_llama_cpp, model: gemma4-12b-it}
      - {profile: local_llama_cpp, model: muse-glimmer-30b}
      - {profile: local_llama_cpp, model: gpt-oss-20b}
  weak_phrasing:
    dataset: nice
    variant: must
    models:
      - {profile: zai, model: glm-5.3}
      - {profile: local_llama_cpp, model: qwen3.6-27b}
      - {profile: local_llama_cpp, model: muse-glimmer-30b}

task3:
  audit_mode: blind

analysis:
  bootstrap_samples: 1000
  numbers_output: outputs/paper_numbers.tex
