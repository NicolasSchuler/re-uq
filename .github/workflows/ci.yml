name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Check whitespace in the current commit
        run: git diff-tree --check --no-commit-id --root -r HEAD

      - name: Run unit and notebook boundary tests with coverage
        run: uv run python -m coverage run --branch --source=scripts -m unittest discover -s tests -v

      - name: Report coverage
        # Informational only: CI does not fail on a coverage threshold.
        run: uv run python -m coverage report -m
