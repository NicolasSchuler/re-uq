[project]
name = "re-uq"
version = "0.1.0"
description = "Notebook-based evaluation pipeline for modality-conditioned uncertainty in LLM-assisted requirements engineering."
requires-python = ">=3.13"
dependencies = [
    "datasets>=2.20.0",
    "matplotlib>=3.10.0",
    "nbformat>=5.10.0",
    "numpy>=2.0.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]

[tool.uv]
package = false
