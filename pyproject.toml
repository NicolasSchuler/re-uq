[project]
name = "re-uq"
version = "1.0.0"
description = "Command-first evaluation artifact for modality-conditioned uncertainty in LLM-assisted requirements engineering."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nicolas Schuler" },
    { name = "Vincenzo Scotti" },
    { name = "Raffaela Mirandola" },
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=2.20.0",
    "hydra-core>=1.3.6",
    "instructor>=1.15,<2",
    "matplotlib>=3.10.0",
    "nbformat>=5.10.0",
    "numpy>=2.0.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "pydantic>=2",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
# Matches the ruff formatter default; long lines are the formatter's job, so
# E501 is deliberately not selected below.
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",   # line length is enforced by the formatter
    "RUF001", # ambiguous unicode in strings: the prompts use typographic quotes
    "SIM108", # ternaries are not always clearer than if/else here
    # Fires on small-N record builders (4 modalities, 4 probe templates, ...)
    # where folding a multi-line dict literal into a comprehension costs more
    # readability than the loop overhead is worth.
    "PERF401",
]

[tool.ruff.lint.per-file-ignores]
# These modules must set MPLCONFIGDIR/XDG_CACHE_HOME before matplotlib is
# imported, so their third-party imports cannot all sit at the top of the file.
"scripts/eval_utils.py" = ["E402"]
"scripts/plot_*.py" = ["E402"]
# This module builds a markdown document, so long prose wrapped across adjacent
# string literals inside list literals is the point, not a missing comma.
"scripts/export_benchmark_ground_truth.py" = ["ISC004"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "tests"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pep8-naming]
# `X` is the scikit-learn convention for a feature matrix; renaming it to `x`
# would read worse to this codebase's audience. `FakeClient` names a class that
# is bound to a local variable, so PascalCase is correct there too.
extend-ignore-names = ["X", "X_*", "FakeClient"]
